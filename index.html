<html lang="en">

    <!-- Primary Meta Tags -->

    <meta name="title" content="Ortus Solutions - Data Pipelines & Automation Specialist" />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ortussolutions.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ortussolutions.com" />
    <meta property="og:site_name" content="Ortus Solutions" />
    <meta property="og:title" content="Ortus Solutions - Data Pipelines & Automation Specialist" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ortus Solutions - Data Pipelines & Automation" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ortussolutions.com" />
    <meta name="twitter:title" content="Ortus Solutions - Data Pipelines & Automation Specialist" />
    <meta name="twitter:description" content="Solo consultant specializing in building data pipelines and automation solutions from zero." />
    <meta name="twitter:image" content="https://ortussolutions.com/og-image.png" />
    <meta name="twitter:creator" content="@ortussolutions" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#06B6D4" />
    <meta name="format-detection" content="telephone=no" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Ortus Solutions",
      "description": "Solo consultant specializing in building data pipelines and automation solutions from zero.",
      "url": "https://ortussolutions.com",
      "logo": "https://ortussolutions.com/logo.png",
      "image": "https://ortussolutions.com/og-image.png",
      "telephone": "+1-XXX-XXX-XXXX",
      "email": "contact@ortussolutions.com",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "sameAs": [
        "https://linkedin.com/in/yourprofile",
        "https://github.com/yourusername",
        "https://twitter.com/yourhandle"
      ],
      "founder": {
        "@type": "Person",
        "name": "Your Name",
        "jobTitle": "Data Engineer & Automation Specialist",
        "url": "https://ortussolutions.com"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "reviewCount": "15"
      },
      "offers": {
        "@type": "AggregateOffer",
        "availability": "https://schema.org/InStock",
        "priceCurrency": "USD"
      }
    }
    </script>

    <div id="root"></div>
